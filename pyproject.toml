[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-jax"
version = "0.1.0"
description = "A strictly typed, named-axis eDSL built on JAX."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "optax>=0.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyright>=1.1"
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
