[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-jax"
version = "0.1.0"
description = "A strictly typed, named-axis eDSL built on JAX."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.26",
    "optax>=0.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyright>=1.1"
]

cuda = ["jax[cuda13]>=0.4.0"]
cuda13 = ["jax[cuda13]>=0.4.0"]
cuda12 = ["jax[cuda12]>=0.4.0"]
tpu = ["jax[tpu]>=0.4.0"]
apple = ["jax[apple]>=0.4.0"]
cpu = ["jax[cpu]>=0.4.0"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]